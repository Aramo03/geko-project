name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: geko_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-db-password-not-a-placeholder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d geko_db"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DEBUG: "True"
      SECRET_KEY: ci-backend-secret-key-not-used-for-deploy
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: geko_db
      DB_USER: postgres
      DB_PASSWORD: ci-db-password-not-a-placeholder
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py init_ui
      - run: python manage.py check
      - run: python manage.py test --noinput

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    env:
      DEBUG: "False"
      SECRET_KEY: ci-docker-secret-key-at-least-32-characters
      POSTGRES_DB: geko_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-docker-db-password-not-placeholder
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      VITE_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d
      - name: Wait until the API and the frontend answer
        run: |
          set -eu
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null http://127.0.0.1:8000/api/schema/swagger-ui/ \
              && curl -fsS -o /dev/null http://127.0.0.1:8000/api/admin/login/ \
              && curl -fsS -o /dev/null http://127.0.0.1:3000/; then
              exit 0
            fi
            sleep 3
          done
          docker compose ps
          docker compose logs
          exit 1
      - name: Categories stay empty on a fresh database
        run: |
          set -eu
          body=$(curl -fsS http://127.0.0.1:8000/api/categories/)
          test "$body" = "[]"
      - name: Tear down
        if: always()
        run: docker compose down -v
