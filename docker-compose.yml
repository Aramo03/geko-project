services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: geko_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change_me
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: geko_db
      DB_USER: postgres
      DB_PASSWORD: change_me
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      - db

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      VITE_BASE_URL: http://127.0.0.1:8000

volumes:
  pgdata:
