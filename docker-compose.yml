services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geko_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # No password in the repo: set POSTGRES_PASSWORD in .env (see
      # .env.example). Without it Postgres refuses to start.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Published so host-side manage.py / a DB client can use localhost:5432.
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-geko_db}"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    # Migrations first (as before), then collectstatic into the volume,
    # then the production server. No runserver in this path.
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    volumes:
      # Static and uploads survive container recreation.
      - staticfiles:/app/staticfiles
      - mediafiles:/app/media
    ports:
      - "8000:8000"
    environment:
      # Production config comes only from the environment (.env).
      DEBUG: ${DEBUG:-False}
      SECRET_KEY: ${SECRET_KEY:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${POSTGRES_DB:-geko_db}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-}
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    # Production image: `npm run build` + nginx (see frontend/Dockerfile).
    # No bind mounts / dev server — the container serves the built bundle.
    # VITE_BASE_URL is baked in at build time, so it is a build arg, not env.
    build:
      context: ./frontend
      args:
        # Empty: the bundle calls /api on the site host. Nginx proxies that
        # to the backend. Set VITE_BASE_URL only for a split API origin.
        VITE_BASE_URL: ${VITE_BASE_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    volumes:
      - mediafiles:/usr/share/nginx/media:ro

volumes:
  pgdata:
  staticfiles:
  mediafiles:
