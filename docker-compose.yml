services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: geko_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change_me
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: geko_db
      DB_USER: postgres
      DB_PASSWORD: change_me
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      - db

  frontend:
    # Production image: `npm run build` + nginx (see frontend/Dockerfile).
    # No bind mounts / dev server — the container serves the built bundle.
    # VITE_BASE_URL is baked in at build time, so it is a build arg, not env.
    build:
      context: ./frontend
      args:
        VITE_BASE_URL: ${VITE_BASE_URL:-http://127.0.0.1:8000}
    ports:
      - "3000:3000"

volumes:
  pgdata:
