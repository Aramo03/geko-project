# Caddy sets X-Forwarded-Proto. Direct hits on :3000 have no header,
# so fall back to the connection scheme (http in local Docker).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 3000;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
        text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # NOTE: nginx does not inherit add_header directives into a location
    # that defines any add_header of its own, so the security headers are
    # repeated in every location below that sets Cache-Control.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Same origin as the site. ^~ wins over the extension regex below,
    # so /media/*.webp is an upload, not a file from the Vite build.
    # Resolve on each request. A plain proxy_pass caches the backend IP
    # at start, so a recreated backend stays unreachable.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ^~ /api/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;
    }

    location ^~ /static/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_redirect off;
    }

    location ^~ /media/ {
        alias /usr/share/nginx/media/;
    }

    # SPA fallback: unknown paths render the React app (incl. the 404 page).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The entry document must never be cached, or deploys stay invisible.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Vite emits content-hashed file names: cache them forever.
    # ^~ stops the regex location below from winning over this prefix.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # Static media/fonts from public/ keep stable names: cache, but revalidate.
    location ~* \.(?:css|js|mjs|webp|png|jpe?g|gif|svg|ico|woff2?|mp4|webm)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
